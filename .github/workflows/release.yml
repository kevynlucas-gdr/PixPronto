name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.2'
      - name: Validate tag
        run: test "${GITHUB_REF_NAME}" = "v$(sed -n 's/^versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Checksums
        run: cd app/build/outputs/apk/release && sha256sum *.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
